name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            homepage/package-lock.json
      - name: Install dependencies
        run: npm run setup
      - name: Build with checks (root path)
        run: npm run build
      - name: Build with checks (subpath)
        run: npm run build
        env:
          SITE_BASE: /any-repo
